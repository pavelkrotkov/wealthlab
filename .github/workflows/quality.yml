name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: mkdir -p .runtime/tmp
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check --output-format=github .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check --output-format=github .
      - run: uv run --frozen python -m tools.quality
      - run: uv run --frozen pytest --cov --cov-report=term-missing --basetemp=.runtime/pytest
      - run: uv run --frozen pip-audit --cache-dir .cache/pip-audit
      - run: uv run --frozen zizmor .github/workflows
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
