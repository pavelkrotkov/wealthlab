[project]
name = "wealthlab"
version = "0.0.1"
description = "Local financial scenario workbench"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "radon>=6.0.1",
  "ruff>=0.16.8",
  "ty>=0.0.83",
  "zizmor>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ty.environment]
python-version = "3.12"
