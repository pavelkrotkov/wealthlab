repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: types
        name: Python type checking
        entry: uv run --frozen ty check .
        language: system
        pass_filenames: false
      - id: metrics
        name: Complexity and size gates
        entry: uv run --frozen python -m tools.quality
        language: system
        pass_filenames: false
